services:
  # Application service. The `target: dev` line builds the development
  # image (includes tsx and dev tooling); the runner stage of the
  # Dockerfile is unused in development.
  server:
    build:
      context: .
      target: dev
    environment:
      - PORT=${PORT}
      - TMDB_API_KEY=${TMDB_API_KEY}
    ports:
      - ${PORT}:${PORT}
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
        - action: rebuild
          path: package.json
